name: Publish Latest Windows

on:
  workflow_run:
    workflows: [Build Windows]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-latest-windows
  cancel-in-progress: false

jobs:
  publish:
    name: Update Windows download
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: windows-latest
    steps:
      - name: Find the latest successful Windows build
        id: source
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/actions/workflows/windows-build.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0]' > build.json
          jq -e --arg repo "$GH_REPO" '
            .conclusion == "success" and
            .head_branch == "main" and
            .head_repository.full_name == $repo and
            .path == ".github/workflows/windows-build.yml"
          ' build.json
          echo "run_id=$(jq -er '.id' build.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -er '.head_sha' build.json)" >> "$GITHUB_OUTPUT"

      - name: Download and verify the existing executable
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" \
            --name X-AnyLabeling-Windows-x64-CPU --dir incoming
          shopt -s nullglob
          executables=(incoming/X-AnyLabeling-v*-CPU.exe)
          if [ "${#executables[@]}" -ne 1 ]; then
            echo "Expected exactly one verified Windows CPU executable." >&2
            exit 1
          fi
          executable="${executables[0]}"
          expected=$(awk '{print $1}' "${executable}.sha256")
          actual=$(sha256sum "$executable" | cut -d ' ' -f 1)
          test "$expected" = "$actual"
          mkdir -p release-assets
          cp "$executable" release-assets/X-AnyLabeling-Windows-x64-CPU.exe
          (
            cd release-assets
            sha256sum X-AnyLabeling-Windows-x64-CPU.exe > X-AnyLabeling-Windows-x64-CPU.exe.sha256
          )

      - name: Publish a single rolling Windows release
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Windows 64 位 CPU 版最新构建。下载下方的 .exe 文件即可运行。

          此预发布条目持续更新，只保留最新安装包；下载链接保持不变。

          - 源码提交：[$SOURCE_SHA](https://github.com/${GH_REPO}/commit/${SOURCE_SHA})
          - 构建记录：[Windows 构建](https://github.com/${GH_REPO}/actions/runs/${SOURCE_RUN_ID})
          - 已通过标注、播放、DICOM 等回归测试及可执行文件版本检查。
          - .sha256 附件用于校验下载完整性。
          EOF

          if gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" > release.json 2>/dev/null; then
            if jq -e '.immutable == true' release.json > /dev/null; then
              echo "This release is immutable and cannot be used for rolling builds." >&2
              exit 1
            fi
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$SOURCE_SHA" -F force=true > /dev/null
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Windows CPU 最新构建" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$SOURCE_SHA" --title "Windows CPU 最新构建" \
              --notes-file release-notes.md --prerelease --latest=false
          fi
          {
            echo "### Windows 最新下载"
            echo "[Release](https://github.com/${GH_REPO}/releases/tag/${RELEASE_TAG})"
            echo "[下载 EXE](https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/X-AnyLabeling-Windows-x64-CPU.exe)"
          } >> "$GITHUB_STEP_SUMMARY"

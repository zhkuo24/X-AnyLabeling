name: Build macOS

on:
  push:
    branches: [main]
    paths:
      - "anylabeling/**"
      - "packaging/pyinstaller/specs/x-anylabeling-macos.spec"
      - "scripts/build_executable.sh"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            os: macos-15
            python_arch: arm64
            arch: arm64
          - name: Intel
            os: macos-15-intel
            python_arch: x64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cpu]" pyinstaller pytest

      - name: Run annotation and media regression tests
        run: >-
          python -m pytest tests/test_canvas tests/test_labeling
          tests/test_settings/test_schema.py tests/test_utils
          tests/test_widgets/test_playback_control.py
          tests/test_widgets/test_canvas_adjustment.py

      - name: Build and archive application
        run: bash scripts/build_executable.sh macos

      - name: Verify archived application
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PY'
          import os
          import plistlib
          import runpy
          import subprocess
          from pathlib import Path

          arch = os.environ["EXPECTED_ARCH"]
          archives = list(Path("dist").glob(f"*-{arch}-unsigned.zip"))
          if len(archives) != 1:
              raise RuntimeError("Expected exactly one macOS archive")
          archive = archives[0]
          subprocess.run(
              ["shasum", "-a", "256", "-c", archive.name + ".sha256"],
              cwd="dist", check=True,
          )
          extracted = Path(os.environ["RUNNER_TEMP"]) / "macos-smoke"
          subprocess.run(
              ["ditto", "-x", "-k", str(archive), str(extracted)],
              check=True,
          )
          bundles = list(extracted.glob("*.app"))
          if len(bundles) != 1:
              raise RuntimeError("Expected exactly one app in the archive")
          app = bundles[0]
          with (app / "Contents/Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          executable = app / "Contents/MacOS" / info["CFBundleExecutable"]
          subprocess.run(
              ["lipo", "-verify_arch", arch, str(executable)], check=True,
          )
          subprocess.run(
              ["codesign", "--verify", "--deep", "--strict", str(app)],
              check=True,
          )
          result = subprocess.run(
              [str(executable), "version"],
              capture_output=True, text=True, timeout=120, check=True,
          )
          expected = runpy.run_path("anylabeling/app_info.py")["__version__"]
          if result.stdout.strip() != expected:
              raise RuntimeError(f"Unexpected app version: {result.stdout!r}")
          print(f"Verified macOS {arch} app version {expected}")
          PY

      - name: Upload macOS application
        uses: actions/upload-artifact@v7
        with:
          name: X-AnyLabeling-macOS-${{ matrix.arch }}
          path: |
            dist/*-${{ matrix.arch }}-unsigned.zip
            dist/*-${{ matrix.arch }}-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

name: Build macOS

on:
  push:
    branches: [main]
    paths:
      - "anylabeling/**"
      - "packaging/pyinstaller/specs/x-anylabeling-macos.spec"
      - "scripts/build_executable.sh"
      - "scripts/release_names.py"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      X_ANYLABELING_SOURCE: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cpu]" pyinstaller pytest

      - name: Run annotation and media regression tests
        run: >-
          python -m pytest tests/test_canvas tests/test_labeling
          tests/test_settings/test_schema.py tests/test_utils
          tests/test_widgets/test_playback_control.py
          tests/test_widgets/test_canvas_adjustment.py

      - name: Build and archive application
        run: bash scripts/build_executable.sh macos

      - name: Name macOS package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset=$(python scripts/release_names.py macos-zip --source "$X_ANYLABELING_SOURCE" --arch arm64)
          test -f "dist/${asset}"
          test -f "dist/${asset}.sha256"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Verify archived application
        env:
          EXPECTED_ARCH: arm64
          PACKAGE_ASSET: ${{ steps.package.outputs.asset }}
        run: |
          python - <<'PY'
          import os
          import plistlib
          import runpy
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from release_names import verify_checksum

          arch = os.environ["EXPECTED_ARCH"]
          asset = os.environ["PACKAGE_ASSET"]
          archive = Path("dist") / asset
          if not archive.is_file():
              raise RuntimeError(f"Missing macOS archive {asset}")
          verify_checksum(archive, Path(f"{archive}.sha256"))
          subprocess.run(
              ["shasum", "-a", "256", "-c", archive.name + ".sha256"],
              cwd="dist", check=True,
          )
          extracted = Path(os.environ["RUNNER_TEMP"]) / "macos-smoke"
          subprocess.run(
              ["ditto", "-x", "-k", str(archive), str(extracted)],
              check=True,
          )
          bundles = list(extracted.glob("*.app"))
          if len(bundles) != 1:
              raise RuntimeError("Expected exactly one app in the archive")
          app = bundles[0]
          with (app / "Contents/Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          executable = app / "Contents/MacOS" / info["CFBundleExecutable"]
          subprocess.run(
              ["lipo", str(executable), "-verify_arch", arch], check=True,
          )
          subprocess.run(
              ["codesign", "--verify", "--deep", "--strict", str(app)],
              check=True,
          )
          result = subprocess.run(
              [str(executable), "version"],
              capture_output=True, text=True, timeout=120,
          )
          if result.returncode:
              raise RuntimeError(f"App version check failed: {result.stderr}")
          expected = runpy.run_path("anylabeling/app_info.py")["__version__"]
          if result.stdout.strip() != expected:
              raise RuntimeError(f"Unexpected app version: {result.stdout!r}")
          print(f"Verified macOS {arch} app version {expected}")
          PY

      - name: Upload macOS application
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
